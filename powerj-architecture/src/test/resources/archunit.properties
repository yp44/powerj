# Violations tolerated by the frozen rules (see ArchitectureTest). The store is committed and only shrinks:
# creation and update are off, so that a new violation cannot be recorded by accident.
# To freeze a NEW rule, set allowStoreCreation=true for one run and commit the files it writes in archunit_store/.
# To drop fixed violations from a store file, run once with freeze.refreeze=true.
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=false
freeze.refreeze=false
