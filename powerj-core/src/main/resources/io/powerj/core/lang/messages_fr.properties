# Messages powerj-core lang (français). Paramètres : {0}, {1}... Apostrophes écrites telles quelles.

# --- Syntax error prefix ---
syntax.error=syntaxe : {0}

# --- Lexer ---
syntax.arrowOutsideBlock=« -> » hors d'un bloc : en argument d'une commande, une lambda s'écrit entre accolades, ex. where { f -> f.size > 1mb }
syntax.loneAmpersand=« & » isolé n'est pas supporté (utiliser && ou ;)
syntax.unexpectedAt=« {0} » inattendu (position {1})
syntax.unmatchedBrace=« } » sans « { » correspondante (position {0})
syntax.unexpectedEquals=« = » inattendu (position {0}) ; affectation : $nom = valeur
syntax.invalidIndex=index invalide à la position {0} (attendu : [nombre])
syntax.unclosedString=chaîne non fermée (ouverte à la position {0})
syntax.textBlockOpening=un bloc de texte s'ouvre par """ suivi d'un retour à la ligne (position {0})
syntax.unclosedTextBlock=bloc de texte non fermé (ouvert à la position {0})
syntax.trailingBackslash=antislash en fin de chaîne
syntax.unknownEscape.string=échappement inconnu \\{0} (pour un antislash, écrire \\\\)
syntax.unknownEscape=échappement inconnu \\{0}
syntax.incompleteUnicodeEscape=échappement \\u incomplet
syntax.invalidUnicodeEscape=échappement \\u{0} invalide

# --- Parser ---
syntax.emptyParentheses=parenthèses vides
syntax.noCommandBefore=« {0} » sans commande avant
syntax.commandExpected=commande attendue
syntax.commandExpectedAfter=commande attendue après « {0} »
syntax.valueExpectedAfterAssignment=valeur attendue après « ${0} = »
syntax.blockAsStage=un bloc seul n'est pas une étape de pipeline : écrire map { … } pour transformer chaque objet, ou where { … } pour le filtrer
syntax.valueNotFirstStage=une valeur ne peut être que la première étape d'un pipeline
syntax.redirectionFileExpected=fichier attendu après la redirection
syntax.redirectionNotLast=« > » redirige la sortie de tout le pipeline : le placer à la fin
syntax.commandNameExpected=nom de commande attendu après ^
syntax.unexpected=« {0} » inattendu
syntax.unexpectedExpression=« expression » inattendu

# --- Expressions ---
syntax.emptyBlock=bloc vide { }
syntax.lambdaBodyExpected=corps de lambda attendu après « -> »
syntax.duplicateLambdaParameter=paramètre de lambda en double : {0}
syntax.nameExpectedAfterDot.end=nom attendu après « . » en fin d'expression
syntax.nameExpectedAfterDot.at=nom attendu après « . » à la position {0}
syntax.nameExpectedAfterSpread.end=nom attendu après « *. » en fin d'expression
syntax.nameExpectedAfterSpread.at=nom attendu après « *. » à la position {0}
syntax.methodNameExpected.end=nom de méthode attendu après « :: » en fin d'expression
syntax.methodNameExpected.at=nom de méthode attendu après « :: » à la position {0}
syntax.classNameExpected.end=nom de classe attendu après new en fin d'expression
syntax.classNameExpected.at=nom de classe attendu après new à la position {0}
syntax.incompleteExpression=expression incomplète
syntax.incompleteExpression.block=expression incomplète dans { {0} }
syntax.openParenExpectedAfterNew=« ( » attendu après new {0}
syntax.missingCloseParen=« ) » manquante (ouverte à la position {0})
syntax.unclosedBlock=bloc non fermé (« { » à la position {0})
syntax.missing=« {0} » manquant
syntax.missing.block=« {0} » manquant dans { {1} }
syntax.expected.end=« {0} » attendu en fin d'expression
syntax.expected.at=« {0} » attendu à la position {1}
syntax.equalsInExpression=« = » dans une expression : pour comparer, utiliser == (position {0})
syntax.variableNameExpected=nom de variable attendu après $ (position {0})
syntax.numberTooLarge=nombre trop grand : {0}
syntax.invalidNumber=nombre invalide : {0} (unités : b kb mb gb tb, ms s m h d)
syntax.unclosedCharacter=caractère non fermé (position {0})
syntax.emptyCharacter=caractère vide '' (position {0})
syntax.characterQuotes=un caractère s'écrit entre apostrophes : 'a' ; pour une chaîne, utiliser "…" (position {0})
