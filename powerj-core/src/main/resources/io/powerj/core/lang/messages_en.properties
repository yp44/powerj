# powerj-core lang messages (English). Placeholders: {0}, {1}... Write apostrophes as is.

# --- Syntax error prefix ---
syntax.error=syntax: {0}

# --- Lexer ---
syntax.arrowOutsideBlock="->" outside a block: as a command argument, a lambda is written in braces, e.g. where { f -> f.size > 1mb }
syntax.loneAmpersand=a lone "&" is not supported (use && or ;)
syntax.unexpectedAt=unexpected "{0}" (position {1})
syntax.unmatchedBrace="}" without a matching "{" (position {0})
syntax.unexpectedEquals=unexpected "=" (position {0}); assignment: $name = value
syntax.invalidIndex=invalid index at position {0} (expected: [number])
syntax.unclosedString=unclosed string (opened at position {0})
syntax.textBlockOpening=a text block opens with """ followed by a line break (position {0})
syntax.unclosedTextBlock=unclosed text block (opened at position {0})
syntax.trailingBackslash=backslash at end of string
syntax.unknownEscape.string=unknown escape \\{0} (for a backslash, write \\\\)
syntax.unknownEscape=unknown escape \\{0}
syntax.incompleteUnicodeEscape=incomplete \\u escape
syntax.invalidUnicodeEscape=invalid \\u{0} escape

# --- Parser ---
syntax.emptyParentheses=empty parentheses
syntax.noCommandBefore="{0}" without a command before it
syntax.commandExpected=command expected
syntax.commandExpectedAfter=command expected after "{0}"
syntax.valueExpectedAfterAssignment=value expected after "${0} ="
syntax.blockAsStage=a block alone is not a pipeline stage: write map { … } to transform each object, or where { … } to filter it
syntax.valueNotFirstStage=a value can only be the first stage of a pipeline
syntax.redirectionFileExpected=file expected after the redirection
syntax.redirectionNotLast=">" redirects the output of the whole pipeline: put it at the end
syntax.commandNameExpected=command name expected after ^
syntax.unexpected=unexpected "{0}"
syntax.unexpectedExpression=unexpected expression

# --- Expressions ---
syntax.emptyBlock=empty block { }
syntax.lambdaBodyExpected=lambda body expected after "->"
syntax.duplicateLambdaParameter=duplicate lambda parameter: {0}
syntax.nameExpectedAfterDot.end=name expected after "." at end of expression
syntax.nameExpectedAfterDot.at=name expected after "." at position {0}
syntax.nameExpectedAfterSpread.end=name expected after "*." at end of expression
syntax.nameExpectedAfterSpread.at=name expected after "*." at position {0}
syntax.methodNameExpected.end=method name expected after "::" at end of expression
syntax.methodNameExpected.at=method name expected after "::" at position {0}
syntax.classNameExpected.end=class name expected after new at end of expression
syntax.classNameExpected.at=class name expected after new at position {0}
syntax.incompleteExpression=incomplete expression
syntax.incompleteExpression.block=incomplete expression in { {0} }
syntax.openParenExpectedAfterNew="(" expected after new {0}
syntax.missingCloseParen=missing ")" (opened at position {0})
syntax.unclosedBlock=unclosed block ("{" at position {0})
syntax.missing=missing "{0}"
syntax.missing.block=missing "{0}" in { {1} }
syntax.expected.end="{0}" expected at end of expression
syntax.expected.at="{0}" expected at position {1}
syntax.equalsInExpression="=" in an expression: to compare, use == (position {0})
syntax.variableNameExpected=variable name expected after $ (position {0})
syntax.numberTooLarge=number too large: {0}
syntax.invalidNumber=invalid number: {0} (units: b kb mb gb tb, ms s m h d)
syntax.unclosedCharacter=unclosed character (position {0})
syntax.emptyCharacter=empty character '' (position {0})
syntax.characterQuotes=a character is written between single quotes: 'a'; for a string, use "…" (position {0})
