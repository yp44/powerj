cp.option.property=Property of the pipeline objects that gives the source (String, Path or File)
mv.summary=Moves or renames files and folders
mv.option.paths=Sources (wildcards accepted), then the destination, or a block { … } that gives the destination of each source
mv.option.force=Overwrites existing targets
mv.option.verbose=Emits each destination
mv.option.dry-run=Changes nothing: shows what would be done
mv.option.allow-protected=Also moves protected paths (list in the protected-paths file of the configuration folder)
mv.option.property=Property of the pipeline objects that gives the source (String, Path or File)
rm.summary=Removes files and folders
rm.option.paths=Files and folders to remove (wildcards accepted), or a block { … } that gives the path of each pipeline object
rm.option.recurse=Removes folders with their content
rm.option.parallel=Removes up to n entries of a folder at the same time, in virtual threads (order of the output free)
rm.option.force=A missing path is not an error
rm.option.verbose=Emits each entry removed
rm.option.dry-run=Changes nothing: shows what would be removed
rm.option.allow-protected=Also removes protected paths (list in the protected-paths file of the configuration folder)
rm.option.property=Property of the pipeline objects that gives the path (String, Path or File)
