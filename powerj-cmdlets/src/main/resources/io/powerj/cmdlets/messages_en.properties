cat.option.numbered=Output: line number, length and text of each line
cat.option.content=Output: length and content of all the files, in one object
cat.one.output=only one output at a time among --lines, --text, --numbered, --content
cat.option.encoding=Charset of the files (default: UTF-8)
cat.option.property=Property of the pipeline objects that gives the file (String, Path or File)
cat.file.expected=file expected: cat <file>... or ... | cat
cat.encoding.unknown=unknown charset: {0}
cat.decode.failed=not readable as {0} text (choose the charset with --encoding)
