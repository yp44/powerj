# powerj-cmdlets messages (English). Placeholders: {0}, {1}... Write apostrophes as is.

# --- Categories ---
category.Files=Files
category.System=System
category.Filters=Filters

# --- ls ---
ls.summary=Lists files and directories
ls.option.paths=Directories or files to list (wildcards * and ? accepted); default: current directory
ls.option.all=Includes hidden files
ls.option.recurse=Walks subdirectories
ls.option.filter=Keeps only names matching the pattern (e.g. *.java)
ls.option.dirs=Directories only
ls.option.files=Files only
ls.option.parallel=Walks the tree with n directories and entries read at the same time, in virtual threads (order free)
ls.parallel.invalid=--parallel expects a number of threads of at least 1, got {0}
ls.dirs.files.incompatible=--dirs and --files are incompatible
ls.not.found=not found: {0}
ls.no.match=no file matches {0}
ls.access.denied=access denied: {0}
ls.read.failed=cannot read {0}: {1}

# --- grep ---
grep.summary=Searches a regular expression in files or pipeline objects
grep.option.pattern=Regular expression (java.util.regex syntax)
grep.option.paths=Files or directories to search (wildcards * and ? accepted); default: current directory, or the pipeline objects
grep.option.recurse=Walks subdirectories
grep.option.parallel=Walks the tree with n files read at the same time, in virtual threads (order of the files free)
grep.option.max-depth=Maximum depth of the walk (1: only the files of the directory); implies --recurse
grep.option.ignore-case=Ignores case
grep.option.invert=Keeps the lines (or objects) that do not match
grep.option.all=Includes hidden files
grep.option.encoding=Charset of the files (default: UTF-8)
grep.option.property=Property of the pipeline objects to search (e.g. name)
grep.option.binary=Also searches binary files (no check of the NUL byte)
grep.option.single-match=Only the first matching line of each file, which is not read further; with -v, the files that never match (line 0)
grep.pattern.invalid=invalid regular expression {0}: {1} (position {2})
grep.encoding.unknown=unknown charset: {0}
grep.parallel.invalid=--parallel expects a number of threads of at least 1, got {0}
grep.maxDepth.invalid=--max-depth expects a depth of at least 1, got {0}
grep.decode.failed=not readable as {0} text (choose the charset with --encoding)
grep.not.found=not found: {0}
grep.no.match=no file matches {0}
grep.access.denied=access denied: {0}
grep.read.failed=cannot read {0}: {1}

# --- cat ---
cat.summary=Reads files as lines or as a whole content
cat.option.paths=Files to read (wildcards * and ? accepted); default: the pipeline objects
cat.option.lines=Output: a String per line (default)
cat.option.text=Output: one String, the content of all the files
cat.option.numbered=Output: line number, length and text of each line
cat.option.content=Output: length and content of all the files, in one object
cat.one.output=only one output at a time among --lines, --text, --numbered, --content
cat.option.encoding=Charset of the files (default: UTF-8)
cat.option.property=Property of the pipeline objects that gives the file (String, Path or File)
cat.file.expected=file expected: cat <file>... or ... | cat
cat.encoding.unknown=unknown charset: {0}
cat.decode.failed=not readable as {0} text (choose the charset with --encoding)
cat.not.found=not found: {0}
cat.no.match=no file matches {0}
cat.is.directory=is a directory: {0}
cat.access.denied=access denied: {0}
cat.read.failed=cannot read {0}: {1}
cat.not.a.file=not a file: {0} (name the property that gives the file with --property)
cat.property.not.a.file=property {0} is not a file (String, Path or File expected): {1}

# --- where ---
where.summary=Filters pipeline objects by a condition
where.option.condition=Boolean condition: lambda { f -> … }, block { $_… }, or short form: property operator value
where.property.invalid=invalid property name: {0}
where.condition.expected=condition expected: where { expression } or where property operator value (operators: == != < <= > >=)
where.value.unsupported=value not supported by the short form: {0}; use where { … }

# --- map ---
map.summary=Transforms each pipeline object with a lambda
map.option.function=Transformation: lambda { f -> … }, block { $_… } or method reference Type::method
map.function.expected=transformation expected: map { f -> … } or map Type::method

# --- collect ---
collect.summary=Gathers the pipeline objects into a single list

# --- sort ---
sort.summary=Sorts pipeline objects by keys
sort.option.keys=Sort keys: property, property path or block { … }; none: the objects themselves
sort.option.desc=Descending order
sort.option.ignore-case=Compares strings ignoring case
sort.key.invalid=sort key expected: property name or block { … }, got {0}
sort.not.comparable=cannot compare {0} with {1}: these values are sorted by their text

# --- first, last, range ---
first.summary=Keeps the first objects of the pipeline
first.option.count=Number of objects kept (default: 1)
last.summary=Keeps the last objects of the pipeline
last.option.count=Number of objects kept (default: 1)
count.negative=expects a number of objects of at least 0, got {0}
range.summary=Keeps the objects between two bounds
range.option.from=Opening bound: position (from 1), regular expression with --property, or block { … }
range.option.to=Closing bound: position (from 1), regular expression with --property, or block { … }
range.option.property=Property (or path) on which --from and --to are searched as regular expressions
range.option.ignore-case=The regular expressions ignore case
range.option.include=Emits the opening and closing objects (default)
range.option.exclude=Leaves out the opening and closing objects
range.option.repeat=After each closing, waits for the next opening (several ranges)
range.include.exclude=--include and --exclude cannot be used together
range.not.position={0} {1} is not a position; add --property <name> to search it in a property, or use a block { … }
range.position.invalid={0} expects a position of at least 1, got {1}
range.repeat.position=--repeat needs a --from that is a regular expression (with --property) or a block { … }
range.property.invalid=property name expected, got {0}

# --- env ---
env.summary=Shows or changes the session environment variables
env.option.name=Name of a variable to show
env.option.set=Creates or changes a variable: NAME=value
env.option.unset=Removes a variable
env.option.append=Appends a value to a list (e.g. PATH): --append NAME value
env.option.prepend=Prepends a value to a list: --prepend NAME value
env.option.value=Value used by --append and --prepend
env.one.action=only one action at a time among --set, --unset, --append, --prepend
env.set.format=--set expects NAME=value
env.variable.missing=no such variable: {0}
env.value.expected=value expected: env --append NAME value

