# powerj-cmdlets messages (English). Placeholders: {0}, {1}... Write apostrophes as is.

# --- Categories ---
category.Files=Files
category.System=System
category.Filters=Filters

# --- ls ---
ls.summary=Lists files and directories
ls.option.paths=Directories or files to list (wildcards * and ? accepted); default: current directory
ls.option.all=Includes hidden files
ls.option.recurse=Walks subdirectories
ls.option.filter=Keeps only names matching the pattern (e.g. *.java)
ls.option.dirs=Directories only
ls.option.files=Files only
ls.dirs.files.incompatible=--dirs and --files are incompatible
ls.not.found=not found: {0}
ls.no.match=no file matches {0}
ls.access.denied=access denied: {0}
ls.read.failed=cannot read {0}: {1}

# --- where ---
where.summary=Filters pipeline objects by a condition
where.option.condition=Boolean condition: lambda { f -> … }, block { $_… }, or short form: property operator value
where.property.invalid=invalid property name: {0}
where.condition.expected=condition expected: where { expression } or where property operator value (operators: == != < <= > >=)
where.value.unsupported=value not supported by the short form: {0}; use where { … }

# --- map ---
map.summary=Transforms each pipeline object with a lambda
map.option.function=Transformation: lambda { f -> … }, block { $_… } or method reference Type::method
map.function.expected=transformation expected: map { f -> … } or map Type::method

# --- collect ---
collect.summary=Gathers the pipeline objects into a single list

# --- env ---
env.summary=Shows or changes the session environment variables
env.option.name=Name of a variable to show
env.option.set=Creates or changes a variable: NAME=value
env.option.unset=Removes a variable
env.option.append=Appends a value to a list (e.g. PATH): --append NAME value
env.option.prepend=Prepends a value to a list: --prepend NAME value
env.option.value=Value used by --append and --prepend
env.one.action=only one action at a time among --set, --unset, --append, --prepend
env.set.format=--set expects NAME=value
env.variable.missing=no such variable: {0}
env.value.expected=value expected: env --append NAME value

