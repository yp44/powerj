map.function.expected=transformation expected: map { f -> … } or map Type::method

# --- collect ---
collect.summary=Gathers the pipeline objects into a single list

# --- sort ---
sort.summary=Sorts pipeline objects by keys
sort.option.keys=Sort keys: property, property path or block { … }; none: the objects themselves
sort.option.desc=Descending order
sort.option.ignore-case=Compares strings ignoring case
sort.key.invalid=sort key expected: property name or block { … }, got {0}
