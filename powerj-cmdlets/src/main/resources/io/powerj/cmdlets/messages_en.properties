# --- mkdir, touch, cp, mv, rm ---
mkdir.summary=Creates folders
mkdir.option.paths=Folders to create, or a block { … } that gives the folder of each pipeline object
mkdir.option.parents=Creates the missing parent folders; an existing folder is not an error
mkdir.option.dry-run=Changes nothing: shows what would be done
mkdir.option.property=Property of the pipeline objects that gives the path (String, Path or File)
mkdir.exists=already exists: {0} (with -p, an existing folder is accepted)
touch.summary=Creates empty files or updates their modification time
touch.option.paths=Files to create or update, or a block { … } that gives the file of each pipeline object
touch.option.dry-run=Changes nothing: shows what would be done
touch.option.property=Property of the pipeline objects that gives the path (String, Path or File)
cp.summary=Copies files and folders
cp.option.paths=Sources (wildcards accepted), then the destination, or a block { … } that gives the destination of each source
cp.option.recurse=Copies folders with their content
