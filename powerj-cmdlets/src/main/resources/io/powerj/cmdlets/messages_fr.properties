grep.option.max-depth=Profondeur maximale du parcours (1 : uniquement les fichiers du dossier) ; implique --recurse
grep.option.ignore-case=Ignore la casse
grep.option.invert=Garde les lignes (ou objets) qui ne correspondent pas
grep.option.all=Inclut les fichiers cachés
grep.option.encoding=Jeu de caractères des fichiers (défaut : UTF-8)
grep.option.property=Propriété des objets du pipeline où chercher (ex. name)
grep.option.binary=Cherche aussi dans les fichiers binaires (pas de vérification de l'octet NUL)
grep.option.single-match=Seulement la première ligne qui correspond dans chaque fichier, qui n'est pas lu plus loin ; avec -v, les fichiers qui ne correspondent jamais (ligne 0)
