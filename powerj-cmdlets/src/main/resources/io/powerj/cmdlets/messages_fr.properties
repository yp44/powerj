range.summary=Garde les objets compris entre deux bornes
range.option.from=Borne d'ouverture : position (à partir de 1), expression régulière avec --property, ou bloc { … }
range.option.to=Borne de fermeture : position (à partir de 1), expression régulière avec --property, ou bloc { … }
