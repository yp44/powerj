# --- ls ---
ls.summary=Liste les fichiers et dossiers
ls.option.paths=Dossiers ou fichiers à lister (jokers * et ? acceptés) ; défaut : dossier courant
ls.option.all=Inclut les fichiers cachés
ls.option.recurse=Parcourt les sous-dossiers
ls.option.filter=Ne garde que les noms correspondant au motif (ex. *.java)
ls.option.dirs=Uniquement les dossiers
ls.option.files=Uniquement les fichiers
ls.option.parallel=Parcourt l'arborescence en lisant n dossiers et entrées à la fois, dans des threads virtuels (ordre libre)
ls.parallel.invalid=--parallel attend un nombre de threads d'au moins 1, reçu {0}
ls.dirs.files.incompatible=--dirs et --files sont incompatibles
ls.not.found=introuvable : {0}
ls.no.match=aucun fichier ne correspond à {0}
ls.access.denied=accès refusé : {0}
ls.read.failed=lecture impossible de {0} : {1}

# --- grep ---
grep.summary=Recherche une expression régulière dans des fichiers ou des objets du pipeline
grep.option.pattern=Expression régulière (syntaxe java.util.regex)
grep.option.paths=Fichiers ou dossiers où chercher (jokers * et ? acceptés) ; défaut : dossier courant, ou les objets du pipeline
grep.option.recurse=Parcourt les sous-dossiers
grep.option.parallel=Parcourt l'arborescence en lisant n fichiers à la fois, dans des threads virtuels (ordre des fichiers libre)
grep.option.max-depth=Profondeur maximale du parcours (1 : uniquement les fichiers du dossier) ; implique --recurse
grep.option.ignore-case=Ignore la casse
grep.option.invert=Garde les lignes (ou objets) qui ne correspondent pas
grep.option.all=Inclut les fichiers cachés
grep.option.encoding=Jeu de caractères des fichiers (défaut : UTF-8)
grep.option.property=Propriété des objets du pipeline où chercher (ex. name)
grep.option.binary=Cherche aussi dans les fichiers binaires (pas de vérification de l'octet NUL)
grep.option.single-match=Seulement la première ligne qui correspond dans chaque fichier, qui n'est pas lu plus loin ; avec -v, les fichiers qui ne correspondent jamais (ligne 0)
grep.pattern.invalid=expression régulière invalide {0} : {1} (position {2})
grep.encoding.unknown=jeu de caractères inconnu : {0}
grep.parallel.invalid=--parallel attend un nombre de threads d'au moins 1, reçu {0}
grep.maxDepth.invalid=--max-depth attend une profondeur d'au moins 1, reçu {0}
grep.decode.failed=illisible comme texte {0} (choisir le jeu de caractères avec --encoding)
grep.not.found=introuvable : {0}
grep.no.match=aucun fichier ne correspond à {0}
grep.access.denied=accès refusé : {0}
grep.read.failed=lecture impossible de {0} : {1}

# --- cat ---
cat.summary=Lit des fichiers ligne à ligne ou en un seul contenu
cat.option.paths=Fichiers à lire (jokers * et ? acceptés) ; défaut : les objets du pipeline
cat.option.lines=Sortie : un String par ligne (défaut)
cat.option.text=Sortie : un seul String, le contenu de tous les fichiers
cat.option.numbered=Sortie : numéro, longueur et texte de chaque ligne
cat.option.content=Sortie : longueur et contenu de tous les fichiers, en un seul objet
cat.one.output=une seule sortie à la fois parmi --lines, --text, --numbered, --content
cat.option.encoding=Jeu de caractères des fichiers (défaut : UTF-8)
cat.option.property=Propriété des objets du pipeline qui donne le fichier (String, Path ou File)
cat.file.expected=fichier attendu : cat <fichier>... ou ... | cat
cat.encoding.unknown=jeu de caractères inconnu : {0}
cat.decode.failed=illisible comme texte {0} (choisir le jeu de caractères avec --encoding)
cat.not.found=introuvable : {0}
cat.no.match=aucun fichier ne correspond à {0}
cat.is.directory=est un dossier : {0}
cat.access.denied=accès refusé : {0}
cat.read.failed=lecture impossible de {0} : {1}
cat.not.a.file=pas un fichier : {0} (nommer la propriété qui donne le fichier avec --property)
cat.property.not.a.file=la propriété {0} n'est pas un fichier (String, Path ou File attendu) : {1}

# --- where ---
where.summary=Filtre les objets du pipeline selon une condition
where.option.condition=Condition booléenne : lambda { f -> … }, bloc { $_… }, ou forme courte : propriété opérateur valeur
where.property.invalid=nom de propriété invalide : {0}
where.condition.expected=condition attendue : where { expression } ou where propriété opérateur valeur (opérateurs : == != < <= > >=)
where.value.unsupported=valeur non prise en charge par la forme courte : {0} ; utiliser where { … }

# --- map ---
map.summary=Transforme chaque objet du pipeline par une lambda
map.option.function=Transformation : lambda { f -> … }, bloc { $_… } ou référence de méthode Type::méthode
map.function.expected=transformation attendue : map { f -> … } ou map Type::méthode

# --- collect ---
collect.summary=Rassemble les objets du pipeline en une seule liste

# --- env ---
env.summary=Affiche ou modifie les variables d'environnement de la session
env.option.name=Nom d'une variable à afficher
env.option.set=Crée ou modifie une variable : NOM=valeur
env.option.unset=Supprime une variable
env.option.append=Ajoute une valeur en fin de liste (ex. PATH) : --append NOM valeur
env.option.prepend=Ajoute une valeur en tête de liste : --prepend NOM valeur
env.option.value=Valeur utilisée par --append et --prepend
env.one.action=une seule action à la fois parmi --set, --unset, --append, --prepend
env.set.format=--set attend NOM=valeur
env.variable.missing=variable absente : {0}
env.value.expected=valeur attendue : env --append NOM valeur

