# Weekly update proposals for the Maven dependencies and plugins and for the GitHub Actions (pinned by commit in
# the workflows: Dependabot reads the version in the trailing comment and updates both). Review C-34.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
          - "org.jacoco:*"
          - "com.diffplug.spotless:*"
      test-libraries:
        patterns:
          - "org.junit*"
          - "org.assertj:*"
          - "com.tngtech.archunit:*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One pull request a week for all the actions, as for the Maven plugins and the test libraries (issue #144): the queue
    # was eight pull requests long, two of them major versions of actions. JLine and JavaFX stay alone, because the person who
    # merges them runs the smoke tests of the image (CONTRIBUTING, "Dependency updates").
    groups:
      github-actions:
        patterns:
          - "*"
