# Weekly update proposals for the Maven dependencies and plugins and for the GitHub Actions (pinned by commit in
# the workflows: Dependabot reads the version in the trailing comment and updates both). Review C-34.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
          - "org.jacoco:*"
          - "com.diffplug.spotless:*"
      test-libraries:
        patterns:
          - "org.junit*"
          - "org.assertj:*"
          - "com.tngtech.archunit:*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
