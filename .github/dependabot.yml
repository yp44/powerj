# Weekly update proposals for the Maven dependencies and plugins and for the GitHub Actions (pinned by commit in
# the workflows: Dependabot reads the version in the trailing comment and updates both). Review C-34.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # "build(deps): bump …", as the CI asks of every commit of a pull request (ci/check-commit-subjects.sh, #184).
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 5
    groups:
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
          - "org.jacoco:*"
          - "com.diffplug.spotless:*"
      test-libraries:
        patterns:
          - "org.junit*"
          - "org.assertj:*"
          - "com.tngtech.archunit:*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    # One pull request a week for the minor and patch updates of all the actions, as for the Maven plugins and the test
    # libraries (issue #144): the queue was eight pull requests long. A major version stays a pull request of its own, since
    # it can change the inputs or the Node runtime of an action and one red check must not hold back all the others. JLine and
    # JavaFX stay alone, because the person who merges them runs the smoke tests of the image (CONTRIBUTING, "Dependency
    # updates").
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
