name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build et tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      - name: Build, tests et image applicative
        run: ./mvnw -B -Pdist verify

      - name: Test de fumée du lanceur
        run: |
          cat > smoke.txt <<'EOF'
          cd /usr
          pwd
          $l = sh -c "printf 'un\ndeux\n'"
          "ligne : $l[1]"
          sh -c "exit 1" || "secours"
          which ls
          (ls / --dirs)*.name
          $u = (ls / | where name == usr).name
          "filtre : $u"
          $t = printf "b\na\nc\n" | sort | where { $_ != "c" }
          "tri : $t"
          "java : $(Math.max(3, 7))"
          $n = List.of("a", "bb", "ccc").stream().filter(s -> s.length() > 1).count()
          "lambda : $n"
          $r = List.of("b", "a") | map String::toUpperCase | where { s -> s != "B" }
          "reference : $r"
          sh -c "exit 3"
          exit $exit
          EOF
          set +e
          powerj-dist/target/jpackage/powerj/bin/powerj < smoke.txt > out.txt 2>&1
          code=$?
          set -e
          cat out.txt
          test "$code" -eq 3 || { echo "code retour attendu 3, obtenu $code"; exit 1; }
          grep -q '/usr$' out.txt
          grep -q 'ligne : deux' out.txt
          grep -q 'secours' out.txt
          grep -q 'ls → cmdlet (io.powerj.cmdlets)' out.txt
          grep -q 'usr$' out.txt
          grep -q 'filtre : usr' out.txt
          grep -q 'tri : \[a, b\]' out.txt
          grep -q 'java : 7' out.txt
          grep -q 'lambda : 2' out.txt
          grep -q 'reference : A' out.txt

      - name: Test de fumée du mode non interactif
        run: |
          pj=powerj-dist/target/jpackage/powerj/bin/powerj
          set +e
          $pj -c 'sh -c "exit 3"'
          code=$?
          set -e
          test "$code" -eq 3 || { echo "code retour attendu 3, obtenu $code"; exit 1; }
          printf 'x.txt\ny.log\nz.txt\n' | $pj -c 'where { $_.endsWith(".txt") }' > stdin.txt
          cat stdin.txt
          test "$(cat stdin.txt)" = "$(printf 'x.txt\nz.txt')"

      - uses: actions/upload-artifact@v5
        with:
          name: powerj-linux-x64
          path: powerj-dist/target/powerj-*.zip
          if-no-files-found: error

  windows:
    name: Exe et installeur (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      - name: Installation de WiX (requis par jpackage pour l'installeur)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2 WixToolset.UI.wixext/5.0.2

      - name: Build, tests, powerj.exe et installeur
        shell: cmd
        run: mvnw.cmd -B -Pdist,installer verify

      - name: Test de fumée de powerj.exe
        shell: pwsh
        run: |
          @'
          cd C:\Windows
          pwd
          $l = ^cmd /c "echo un& echo deux"
          "ligne : $l[1]"
          ^cmd /c "exit 1" || "secours"
          which ls
          (ls C:\Windows --dirs)*.name
          $u = (ls C:\ | where name == Windows).name
          "filtre : $u"
          $t = ^cmd /c "echo b& echo a& echo c" | ^sort | where { $_ != "c" }
          "tri : $t"
          "java : $(Math.max(3, 7))"
          $n = List.of("a", "bb", "ccc").stream().filter(s -> s.length() > 1).count()
          "lambda : $n"
          $r = List.of("b", "a") | map String::toUpperCase | where { s -> s != "B" }
          "reference : $r"
          ^cmd /c "exit 3"
          exit $exit
          '@ | Set-Content smoke.txt
          cmd /c "powerj-dist\target\jpackage\powerj\powerj.exe < smoke.txt > out.txt 2>&1"
          $code = $LASTEXITCODE
          Get-Content out.txt
          if ($code -ne 3) { throw "code retour attendu 3, obtenu $code" }
          foreach ($attendu in 'C:\Windows', 'ligne : deux', 'secours', 'cmdlet (io.powerj.cmdlets)', 'System32',
                               'filtre : Windows', 'tri : [a, b]', 'java : 7', 'lambda : 2', 'reference : A') {
            if (-not (Select-String -Path out.txt -SimpleMatch $attendu -Quiet)) { throw "absent de la sortie : $attendu" }
          }
          # Le code 3 attendu de powerj.exe ne doit pas devenir le code retour de l'étape.
          exit 0

      - name: Test de fumée du mode non interactif
        shell: pwsh
        run: |
          $pj = "powerj-dist\target\jpackage\powerj\powerj.exe"
          & $pj -c '^cmd /c exit 3'
          if ($LASTEXITCODE -ne 3) { throw "code retour attendu 3, obtenu $LASTEXITCODE" }
          'where { $_.endsWith(".txt") }' | Set-Content filtre.pj
          $lignes = 'x.txt', 'y.log', 'z.txt' | & $pj filtre.pj
          $lignes
          if (($lignes -join ',') -ne 'x.txt,z.txt') { throw "filtrage de l'entrée standard incorrect : $lignes" }
          exit 0

      - name: Archive portable powerj.exe
        uses: actions/upload-artifact@v5
        with:
          name: powerj-windows-x64-portable
          path: powerj-dist/target/powerj-*.zip
          if-no-files-found: error

      - name: Installeur Windows
        uses: actions/upload-artifact@v5
        with:
          name: powerj-windows-x64-installer
          path: powerj-dist/target/installer/*.exe
          if-no-files-found: error
