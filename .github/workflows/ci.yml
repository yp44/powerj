name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run in progress for it; on main every run goes through.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The actions are pinned by commit (a tag can be moved); the comment gives the tag. Dependabot updates both.
jobs:
  build:
    name: Build and tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build, tests and application image
        run: ./mvnw -B -Pdist verify

      - name: Test coverage report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage-report
          path: powerj-coverage/target/site/jacoco-aggregate/
          if-no-files-found: ignore

      # The smoke tests are scripts (ci/smoke): they run on a developer's machine after `./mvnw -Pdist verify` too.
      - name: Smoke test of the launcher
        run: ci/smoke/launcher.sh

      - name: Profiler of the perf mode in the launcher
        run: ci/smoke/profiler.sh

      - name: Smoke test of the non-interactive mode
        run: ci/smoke/non-interactive.sh

      - name: Smoke test of the third-party modules
        run: ci/smoke/third-party-modules.sh

      - name: Smoke test of the graphical module (powerj-fx)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libxtst6 libxxf86vm1 libgl1
          ci/smoke/fx.sh

      - name: Smoke test of the languages (en / fr)
        run: ci/smoke/languages.sh

      - name: Smoke test of the tilde (~ = HOME)
        run: ci/smoke/tilde.sh

      - name: Graphical module powerj-fx
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: powerj-fx-linux-x64
          path: powerj-fx/target/powerj-fx-*-linux.zip
          if-no-files-found: error

      - name: Example module greet.jar
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: greet-module
          path: examples/greet/target/greet.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: powerj-linux-x64
          path: powerj-dist/target/powerj-*.zip
          if-no-files-found: error

  # The jobs below do not need the application image: they run beside the build, not after it.
  fx-ui:
    name: Window of the graphical module (Linux, xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libxtst6 libxxf86vm1 libgl1

      # The tests tagged "ui" build the real window (powerj-fx/src/test/.../GridViewUiTest); the ordinary build leaves them out.
      - name: UI tests
        run: xvfb-run -a ./mvnw -B -ntp -Pfx-ui -pl powerj-fx -am test -Dsurefire.failIfNoSpecifiedTests=false

  without-fx:
    name: Build without the graphical module (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Keeps -DskipFx alive: a platform that has no JavaFX builds and checks everything else (review C-33).
      - name: Build and tests
        run: ./mvnw -B -DskipFx verify

  macos:
    name: Build and launcher (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # -fae: every module that can be built is, so that one run shows all that macOS breaks.
      - name: Build, tests and application image
        run: ./mvnw -B -fae -Pdist verify

      # jpackage makes an application bundle on macOS: the launcher is inside it. The smoke test of the profiler looks for
      # the layout of the Linux and Windows images and is left out.
      - name: Smoke tests of the launcher
        run: |
          export PJ="$PWD/powerj-dist/target/jpackage/powerj.app/Contents/MacOS/powerj"
          ci/smoke/launcher.sh
          ci/smoke/non-interactive.sh
          ci/smoke/third-party-modules.sh
          ci/smoke/languages.sh
          ci/smoke/tilde.sh

      - name: Application image (macOS)
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: powerj-macos
          path: powerj-dist/target/powerj-*.zip*
          if-no-files-found: error

  windows:
    name: Exe and installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install WiX (jpackage needs it for the installer)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2 WixToolset.UI.wixext/5.0.2

      - name: Build, tests, powerj.exe and installer
        shell: cmd
        run: mvnw.cmd -B -Pdist,installer verify

      - name: Smoke test of powerj.exe
        shell: pwsh
        run: |
          @'
          cd C:\Windows
          pwd
          $l = ^cmd /c "echo un& echo deux"
          "ligne : $l[1]"
          ^cmd /c "exit 1" || "secours"
          which ls
          (ls C:\Windows --dirs)*.name
          $u = (ls C:\ | where name == Windows).name
          "filtre : $u"
          $t = ^cmd /c "echo b& echo a& echo c" | ^sort | where { $_ != "c" }
          "tri : $t"
          "java : $(Math.max(3, 7))"
          $n = List.of("a", "bb", "ccc").stream().filter(s -> s.length() > 1).count()
          "lambda : $n"
          $r = List.of("b", "a") | map String::toUpperCase | where { s -> s != "B" }
          "reference : $r"
          $c = (ls C:\ | where name == Windows | collect).size()
          "collect : $c"
          ^cmd /c "exit 3"
          exit $exit
          '@ | Set-Content smoke.txt
          cmd /c "powerj-dist\target\jpackage\powerj\powerj.exe < smoke.txt > out.txt 2>&1"
          $code = $LASTEXITCODE
          Get-Content out.txt
          if ($code -ne 3) { throw "expected exit code 3, got $code" }
          foreach ($expected in 'C:\Windows', 'ligne : deux', 'secours', 'cmdlet (io.powerj.cmdlets)', 'System32',
                               'filtre : Windows', 'tri : [a, b]', 'java : 7', 'lambda : 2', 'reference : A',
                               'collect : 1') {
            if (-not (Select-String -Path out.txt -SimpleMatch $expected -Quiet)) { throw "missing from the output: $expected" }
          }
          # The expected exit code 3 of powerj.exe must not become the step's exit code.
          exit 0

      - name: Profiler of the perf mode in the launcher
        shell: pwsh
        run: |
          $app = "powerj-dist\target\jpackage\powerj"
          $java = Get-ChildItem $app -Recurse -Filter java.exe | Where-Object { $_.FullName -like '*runtime*bin*' } | Select-Object -First 1
          $modules = & $java.FullName --list-modules
          if (-not ($modules -match '^jdk\.jfr@')) { throw "jdk.jfr is not in the image" }
          if (-not ($modules -match '^jdk\.management@')) { throw "jdk.management is not in the image" }
          # The profiler is only resolved when asked: without this option the perf mode has no recording.
          $cfg = Get-ChildItem $app -Recurse -Filter powerj.cfg | Select-Object -First 1
          if (-not (Select-String -Path $cfg.FullName -SimpleMatch '--add-modules=jdk.jfr' -Quiet)) { throw "option --add-modules=jdk.jfr is not in powerj.cfg" }

      - name: Smoke test of the non-interactive mode
        shell: pwsh
        run: |
          $pj = "powerj-dist\target\jpackage\powerj\powerj.exe"
          & $pj -c '^cmd /c exit 3'
          if ($LASTEXITCODE -ne 3) { throw "expected exit code 3, got $LASTEXITCODE" }
          'where { $_.endsWith(".txt") }' | Set-Content filter.pj
          $lines = 'x.txt', 'y.log', 'z.txt' | & $pj filter.pj
          $lines
          if (($lines -join ',') -ne 'x.txt,z.txt') { throw "standard input filtering is wrong: $lines" }
          # --version and --help answer without starting the shell.
          $version = & $pj --version
          if (-not ($version -match '^PowerJ .* \(Java ')) { throw "--version is wrong: $version" }
          $help = (& $pj --help) -join ' '
          if (-not ($help -match 'usage: powerj' -and $help -match '--version' -and $help -match '--help')) { throw "--help is wrong: $help" }
          exit 0

      - name: Smoke test of the third-party modules
        shell: pwsh
        run: |
          $pj = "$PWD\powerj-dist\target\jpackage\powerj\powerj.exe"
          $env:POWERJ_HOME = "$env:RUNNER_TEMP\pjhome"
          New-Item -ItemType Directory -Force "$env:POWERJ_HOME\modules" | Out-Null
          Copy-Item examples\greet\target\greet.jar "$env:POWERJ_HOME\modules\"
          $lines = & $pj -c 'greet -n Yves -c 2 | map { g -> g.message }'
          $lines
          if (($lines -join ',') -ne 'Hello Yves!,Hello Yves!') { throw "greet is wrong: $lines" }
          $env:POWERJ_LANG = 'fr'
          $fr = & $pj -c 'greet -n Yves'
          $fr
          if (-not ($fr -match 'Bonjour Yves !')) { throw "greet in French is wrong: $fr" }
          $fr = & $pj -c 'nope' 2>&1 | Out-String
          $fr
          if (-not ($fr -match 'commande inconnue : nope')) { throw "French message missing: $fr" }
          Remove-Item Env:POWERJ_LANG
          $modules = & $pj -c 'mod-list'
          $modules
          if (-not ($modules -match 'com.example.greet')) { throw "mod-list does not list com.example.greet" }
          exit 0

      - name: Smoke test of the graphical module (powerj-fx)
        shell: pwsh
        run: |
          # Loading and consent only: opening a window is checked by hand (docs/acceptance/fx-grid.md).
          $pj = "$PWD\powerj-dist\target\jpackage\powerj\powerj.exe"
          $env:POWERJ_HOME = "$env:RUNNER_TEMP\fxhome"
          New-Item -ItemType Directory -Force "$env:POWERJ_HOME\modules" | Out-Null
          Expand-Archive (Get-ChildItem powerj-fx\target\powerj-fx-*-win.zip).FullName "$env:POWERJ_HOME\modules"
          $refusal = & $pj -c 'mod-list' 2>&1 | Out-String
          $refusal
          # The message gives the line to put in config.properties: the answer is tied to the content of the module.
          $allow = [regex]::Match($refusal, 'modules\.nativeAccess\.io\.powerj\.fx=sha256:[0-9a-f]{64}').Value
          if (-not $allow) { throw "consent is missing: $refusal" }
          Set-Content "$env:POWERJ_HOME\config.properties" $allow
          $modules = & $pj -c 'mod-list' | Out-String
          $modules
          if (-not ($modules -match 'io.powerj.fx')) { throw "mod-list does not list io.powerj.fx" }
          $help = & $pj -c 'help grid' | Out-String
          $help
          if (-not ($help -match '--max-rows')) { throw "help grid has no --max-rows: $help" }
          exit 0

      - name: Graphical module powerj-fx
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: powerj-fx-windows-x64
          path: powerj-fx/target/powerj-fx-*-win.zip
          if-no-files-found: error

      - name: Portable powerj.exe archive
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: powerj-windows-x64-portable
          path: powerj-dist/target/powerj-*.zip
          if-no-files-found: error

      - name: Windows installer
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: powerj-windows-x64-installer
          path: powerj-dist/target/installer/*.exe
          if-no-files-found: error
