name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      repeat-core-tests:
        description: 'Run the tests of powerj-core this many more times on macOS, to hunt a flaky test (docs/quality/clock-dependent-tests.md)'
        type: number
        default: 0

permissions:
  contents: read

# A new push to a pull request cancels the run in progress for it; on main every run goes through.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The actions are pinned by commit (a tag can be moved); the comment gives the tag. Dependabot updates both.
jobs:
  build:
    name: Build and tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # A javac warning fails the build (-Xlint:all with -Werror, #146): a fresh checkout compiles everything.
      - name: Build, tests and application image
        run: ./mvnw -B -Pdist verify

      # No test writes to the native stream of the forked JVM: Surefire keeps what it lost in a .dumpstream file (#145).
      - name: Surefire channel is not corrupted
        if: always()
        run: ci/check-surefire-channel.sh

      - name: Test coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: powerj-coverage/target/site/jacoco-aggregate/
          if-no-files-found: ignore

      # The smoke tests are scripts (ci/smoke): they run on a developer's machine after `./mvnw -Pdist verify` too.
      - name: Smoke test of the launcher
        run: ci/smoke/launcher.sh

      - name: Profiler of the perf mode in the launcher
        run: ci/smoke/profiler.sh

      - name: Modules of PowerJ in the image
        run: ci/smoke/modules.sh

      - name: Smoke test of the non-interactive mode
        run: ci/smoke/non-interactive.sh

      - name: Smoke test of the third-party modules
        run: ci/smoke/third-party-modules.sh

      - name: Smoke test of the consent to native access
        run: ci/smoke/native-access.sh

      - name: Smoke test of the properties read across modules
        run: ci/smoke/properties.sh

      # The filter that decides which messages of the window step fail it (#190): no launcher and no display needed.
      - name: Filter of the window smoke test
        run: ci/smoke/window-filter-test.sh

      - name: Smoke test of the graphical module (powerj-fx)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libxtst6 libxxf86vm1 libgl1
          ci/smoke/fx.sh

      - name: Smoke test of the languages (en / fr)
        run: ci/smoke/languages.sh

      - name: Smoke test of the tilde (~ = HOME)
        run: ci/smoke/tilde.sh

      - name: Smoke test of the wildcards of native commands
        run: ci/smoke/wildcards.sh

      - name: Graphical module powerj-fx
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: powerj-fx-linux-x64
          path: powerj-fx/target/powerj-fx-*-linux.zip
          if-no-files-found: error

      - name: Example module greet.jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: greet-module
          path: examples/greet/target/greet.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: powerj-linux-x64
          path: powerj-dist/target/powerj-*.zip
          if-no-files-found: error

  # The jobs below do not need the application image: they run beside the build, not after it.
  commit-subjects:
    name: Commit subjects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cases of the check
        run: ci/check-commit-subjects-test.sh

      # type(scope): subject, with a type of CONTRIBUTING.md (#184). Only a pull request has a range of commits of its own.
      - name: Subjects of the commits of the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ci/check-commit-subjects.sh "$BASE" "$HEAD"

  fx-ui:
    name: Window of the graphical module (Linux, xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libxtst6 libxxf86vm1 libgl1

      # The tests tagged "ui" build the real window (powerj-fx/src/test/.../GridViewUiTest); the ordinary build leaves them out.
      - name: UI tests
        run: xvfb-run -a ./mvnw -B -ntp -Pfx-ui -pl powerj-fx -am test -Dsurefire.failIfNoSpecifiedTests=false

  without-fx:
    name: Build without the graphical module (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Keeps -DskipFx alive: a platform that has no JavaFX builds and checks everything else (review C-33).
      - name: Build and tests
        run: ./mvnw -B -DskipFx verify

  macos:
    name: Build and launcher (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # -fae: every module that can be built is, so that one run shows all that macOS breaks.
      - name: Build, tests and application image
        run: ./mvnw -B -fae -Pdist verify

      - name: Surefire channel is not corrupted
        if: always()
        run: ci/check-surefire-channel.sh

      # Only by hand (`gh workflow run ci.yml -f repeat-core-tests=20`): the suite has just run once above, and a test that
      # fails once in twenty is not seen by one run. The first failure stops the loop and names its run.
      - name: Repeat the tests of the core
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repeat-core-tests > 0 }}
        env:
          REPEATS: ${{ inputs.repeat-core-tests }}
        run: |
          for i in $(seq 1 "$REPEATS"); do
            echo "::group::powerj-core tests, extra run $i of $REPEATS"
            ./mvnw -B -q -pl powerj-core -am -Djacoco.skip=true test || { echo "::error::failed on extra run $i of $REPEATS"; exit 1; }
            echo "::endgroup::"
          done

      # jpackage makes an application bundle on macOS: the launcher is inside it. The smoke test of the profiler looks for
      # the layout of the Linux and Windows images and is left out.
      - name: Smoke tests of the launcher
        run: |
          export PJ="$PWD/powerj-dist/target/jpackage/powerj.app/Contents/MacOS/powerj"
          ci/smoke/launcher.sh
          ci/smoke/modules.sh
          ci/smoke/non-interactive.sh
          ci/smoke/third-party-modules.sh
          ci/smoke/native-access.sh
          ci/smoke/properties.sh
          ci/smoke/languages.sh
          ci/smoke/tilde.sh
          ci/smoke/wildcards.sh

      - name: Application image (macOS)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: powerj-macos
          path: powerj-dist/target/powerj-*.zip*
          if-no-files-found: error

  windows:
    name: Exe and installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install WiX (jpackage needs it for the installer)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2 WixToolset.UI.wixext/5.0.2

      - name: Build, tests, powerj.exe and installer
        shell: cmd
        run: mvnw.cmd -B -Pdist,installer verify

      # No Surefire channel check here, on purpose: on Windows the forked JVM of powerj-architecture and powerj-testing writes
      # "Boot Manifest-JAR contains absolute paths in classpath ... disableClassPathURLCheck" to the channel, which the script
      # reports as a corruption although no test wrote it (#145; the check runs on Linux and macOS, as the issue says).

      # The same sessions as ci/smoke/*.sh, written for PowerShell and the programs of Windows (ci/smoke/*.ps1, #183): they
      # run on a developer's machine too (`pwsh ci/smoke/launcher.ps1` after `mvnw.cmd -Pdist verify`).
      - name: Smoke test of powerj.exe
        shell: pwsh
        run: ci/smoke/launcher.ps1

      - name: Profiler of the perf mode in the launcher
        shell: pwsh
        run: ci/smoke/profiler.ps1

      - name: Modules of PowerJ in the image
        shell: pwsh
        run: ci/smoke/modules.ps1

      - name: Smoke test of the non-interactive mode
        shell: pwsh
        run: ci/smoke/non-interactive.ps1

      - name: Smoke test of the third-party modules
        shell: pwsh
        run: ci/smoke/third-party-modules.ps1

      # Loading and consent only: opening a window is checked by hand (docs/acceptance/fx-grid.md).
      - name: Smoke test of the graphical module (powerj-fx)
        shell: pwsh
        run: ci/smoke/fx.ps1

      - name: Graphical module powerj-fx
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: powerj-fx-windows-x64
          path: powerj-fx/target/powerj-fx-*-win.zip
          if-no-files-found: error

      - name: Portable powerj.exe archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: powerj-windows-x64-portable
          path: powerj-dist/target/powerj-*.zip
          if-no-files-found: error

      - name: Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: powerj-windows-x64-installer
          path: powerj-dist/target/installer/*.exe
          if-no-files-found: error
